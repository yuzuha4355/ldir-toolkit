version: '3.8'

services:
  # ========== Red Hat 系 ==========
  centos7-test:
    build:
      context: ..
      dockerfile: docker-test/Dockerfile.centos7
    container_name: ldir-centos7-test
    hostname: centos7-forensics
    privileged: true
    volumes:
      - ./shared-output:/output
    networks:
      - ldir-network

