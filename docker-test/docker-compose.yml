version: '3.8'

services:
  # Ubuntu 22.04 テスト環境
  ubuntu-test:
    build:
      context: ..
      dockerfile: docker-test/Dockerfile.ubuntu
    container_name: ldir-ubuntu-test
    hostname: ubuntu-forensics
    privileged: true
    volumes:
      - ./shared-output:/output
      - ../ldir-toolkit:/opt/ldir-toolkit
    tty: true
    stdin_open: true
    networks:
      - ldir-test-net

  # Debian 12 テスト環境
  debian-test:
    build:
      context: ..
      dockerfile: docker-test/Dockerfile.debian
    container_name: ldir-debian-test
    hostname: debian-forensics
    privileged: true
    volumes:
      - ./shared-output:/output
      - ../ldir-toolkit:/opt/ldir-toolkit
    tty: true
    stdin_open: true
    networks:
      - ldir-test-net

  # Rocky Linux 9 (CentOS後継) テスト環境
  rocky-test:
    build:
      context: ..
      dockerfile: docker-test/Dockerfile.centos
    container_name: ldir-rocky-test
    hostname: rocky-forensics
    privileged: true
    volumes:
      - ./shared-output:/output
      - ../ldir-toolkit:/opt/ldir-toolkit
    tty: true
    stdin_open: true
    networks:
      - ldir-test-net

networks:
  ldir-test-net:
    driver: bridge
