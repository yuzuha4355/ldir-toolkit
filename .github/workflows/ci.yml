name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: make lint
      - name: Unit tests
        run: make test

  smoke:
    name: Smoke (${{ matrix.image }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            setup: "true"
          - image: ubuntu:20.04
            setup: "true"
          - image: debian:12
            setup: "true"
          - image: rockylinux:9
            setup: dnf install -y tar gzip findutils
          - image: almalinux:8
            setup: dnf install -y tar gzip findutils
          - image: fedora:latest
            setup: dnf install -y tar gzip findutils
          - image: amazonlinux:2023
            setup: dnf install -y tar gzip findutils
          - image: archlinux:latest
            setup: "true"
          - image: opensuse/leap:15
            setup: zypper --non-interactive install tar gzip findutils
          # busybox userland: only bash is added
          - image: alpine:3
            setup: apk add --no-cache bash
    steps:
      - name: Install prerequisites
        working-directory: /
        run: ${{ matrix.setup }}
      - uses: actions/checkout@v4
      - name: Unit tests
        run: bash tests/test_unit.sh
      - name: Smoke test
        run: bash tests/test_smoke.sh

  # コンテナではなく実機（systemd と Docker が稼働）での実収集。
  # コンテナでは見えない遅さや失敗を拾う。
  smoke-host:
    name: Smoke (ubuntu-latest host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test
        run: sudo env KEEP_OUTPUT=1 TMPDIR=/tmp/ldir-smoke bash -c 'mkdir -p "$TMPDIR" && bash tests/test_smoke.sh'
      - name: Module results and timings
        if: always()
        run: |
          sudo sh -c 'sed -n "/^=== Collection Modules/,\$p" /tmp/ldir-smoke/*/out/*/metadata/manifest.txt'
          # 進行ログ（時刻付き）。どの処理に時間がかかったかを追える
          sudo sh -c 'grep -h "^\[" /tmp/ldir-smoke/*/out/*/metadata/collection.log' | cut -c1-200
